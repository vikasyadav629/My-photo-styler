
name: My Photo Styler CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    name: Validate website files
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Install dependencies
        run: npm ci

      - name: Check required files
        run: |
          test -f index.html
          test -f css/styles.css
          test -f js/main.js
          test -d images
          echo "All required website files exist."

      - name: Validate HTML
        run: npm run validate-html

      - name: Validate CSS
        run: npm run validate-css

      - name: Security audit
        run: npm audit

      - name: Detect secrets with Gitleaks
        uses: gitleaks/gitleaks-action@v2
